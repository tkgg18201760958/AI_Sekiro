# Global config: key mappings, reward weights, training hyperparameters.
# Every module reads its own top-level section via
# sekiro_ai.utils.config_loader.load_config(); keep unrelated settings under
# their own key so modules stay independent of each other.

controller:
  # Action name (lowercase, matches sekiro_ai.controller.Action member names)
  # -> input spec. Missing entries fall back to
  # sekiro_ai.controller.action_map.DEFAULT_KEYMAP, so you only need to list
  # the actions you want to remap from the default.
  keymap:
    wait:
      type: none
    attack:
      type: mouse
      button: left
    guard:
      type: mouse
      button: right
    parry:
      type: mouse
      button: right
      duration: 0.08
    dodge_left:
      type: combo
      keys: [shift, a]
      duration: 0.15
    dodge_right:
      type: combo
      keys: [shift, d]
      duration: 0.15
    backstep:
      type: combo
      keys: [shift, s]
      duration: 0.15

calibration:
  # Real-game pixel calibration (sekiro_ai.state_reader.pixel_reader).
  # PixelStateReader.read() still raises NotImplementedError even with this
  # section fully filled in -- see docs/live_game.md: the mss-capture +
  # OpenCV bar-fill measurement pipeline itself hasn't been written yet.
  #
  # The four bar rects and hp_color_hsv_range below were measured from
  # GAME_PIC/BOSS.png (a 1280x720 screenshot), so they're a starting point
  # rather than a live-verified calibration:
  #   - Re-measure resolution/rects if the game runs at a different
  #     resolution or window scale than 1280x720.
  #   - perilous_icon_template is still null: BOSS.png doesn't show a "危"
  #     prompt, so a template crop still needs to be captured during an
  #     actual perilous attack against a live game window.
  #   - Once read() is implemented, confirm the rects actually track bar
  #     drain/fill across real gameplay with
  #     `tests/test_state_reader.py --live --steps 20` -- a single still
  #     frame can't verify that.
  resolution: [1280, 720]
  player_hp_bar: [70, 647, 184, 15]       # bottom-left salmon/coral bar
  player_posture_bar: [507, 617, 266, 14] # bottom-center yellow chevron bar (excludes the "<"/">" side markers)
  boss_hp_bar: [71, 60, 279, 14]          # top-left dark red bar
  boss_posture_bar: [580, 40, 119, 10]    # top-center yellow chevron bar (excludes the "<"/">" side markers)
  perilous_icon_template: null   # path to a saved template image, e.g. assets/perilous_icon.png -- BOSS.png doesn't show a "危" prompt, so this still needs a screenshot taken during a perilous attack
  hp_color_hsv_range: [[0, 100, 90], [10, 255, 255]]   # covers both the boss's dark red and the player's lighter salmon fill

reward:
  # Weight name -> value. Missing entries fall back to
  # sekiro_ai.reward.reward_calculator.DEFAULT_WEIGHTS. Tune these based on
  # tests/test_reward.py output and, later, observed training behavior
  # (e.g. if the agent learns to stall, increase the magnitude of `step`).
  weights:
    boss_hp_delta: 100.0
    player_hp_delta: 100.0
    boss_posture_delta: 20.0
    player_posture_delta: 20.0
    player_hit: -5.0
    boss_dead: 500.0
    player_dead: -500.0
    step: -0.01
